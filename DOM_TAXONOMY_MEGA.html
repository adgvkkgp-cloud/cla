<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дом — МЕГА-таксономия</title>
<style>
:root{--bg:#0f1011;--surface:#17181b;--card:#1d1e22;--border:#2c2d34;--text:#ececf2;--muted:#7c7e8c;
--g1:#e0a44b;--g2:#e0644b;--g3:#5aa9e6;--g4:#5ad17a;--g5:#b07cf0;--g6:#f06aa0;--g7:#3fd0c0;--g8:#9aa0b4;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 15% 10%,rgba(224,164,75,.06),transparent 50%),radial-gradient(ellipse at 85% 90%,rgba(90,169,230,.06),transparent 50%)}
header{background:var(--surface);border-bottom:2px solid var(--g1);padding:1.1rem 1.4rem .9rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
h1{font-size:1.35rem;font-weight:800}h1 span{color:var(--g1)}
.stats{font-size:.78rem;color:var(--muted);margin:.45rem 0 .6rem}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 12px 9px 34px;color:var(--text);font-size:.9rem}
.search-wrap input:focus{outline:none;border-color:var(--g1)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.filters{display:flex;gap:5px;flex-wrap:wrap;padding:.6rem 1.4rem;background:var(--surface);border-bottom:1px solid var(--border);max-height:120px;overflow-y:auto}
.filter-btn{padding:4px 10px;border:1px solid var(--border);border-radius:18px;font-size:.72rem;cursor:pointer;background:var(--card);color:var(--muted);white-space:nowrap}
.filter-btn:hover{border-color:var(--g1);color:var(--text)}
.filter-btn.active{background:var(--g1);color:#181818;border-color:var(--g1);font-weight:600}
.content{padding:1rem 1.4rem 3rem}
.group-divider{display:flex;align-items:center;gap:12px;margin:1.6rem 0 1rem}
.gl{flex:1;height:1px;background:var(--border)}
.glabel{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--g1)}
.cat{margin-bottom:1.5rem}
.cat-head{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cat-name{font-size:1rem;font-weight:700;flex:1}
.cat-count{font-size:.72rem;color:var(--muted)}
.cat-desc{font-size:.74rem;color:var(--muted);margin-bottom:8px;font-style:italic}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:5px 8px;border-radius:6px;font-size:.84rem;align-items:baseline}
.row:nth-child(odd){background:rgba(255,255,255,.018)}
.row:hover{background:rgba(224,164,75,.07)}
.num{color:var(--muted);font-size:.72rem;text-align:right;font-variant-numeric:tabular-nums}
.nm{font-weight:600}.ds{color:var(--muted);font-size:.76rem;margin-left:6px}
.no-results{text-align:center;color:var(--muted);padding:3rem 0}
footer{padding:1.5rem 1.4rem;color:var(--muted);font-size:.74rem;border-top:1px solid var(--border);text-align:center}
</style></head><body>
<header><h1>🏠 Дом — <span>МЕГА-таксономия</span></h1>
<div class="stats" id="stats">Загрузка…</div>
<div class="search-wrap"><span class="search-icon">🔍</span><input id="search" placeholder="Поиск: спальня, диван, лофт, паркет, подвал…" oninput="filterAll()"></div></header>
<div class="filters" id="filters"></div><div class="content" id="content"></div><footer id="footer"></footer>

/* ══════════ УТОЧНЕНИЕ И РАСШИРЕНИЕ РАЗДЕЛОВ ══════════
   В справочных разделах (VII–XV) описанием у каждой позиции стояла заглушка
   вида «стиль», «мебель», «свет» — одинаковая для всей категории. setDesc()
   заменяет такие заглушки на содержательные описания, ext() дописывает новые
   позиции. Названия и структура разделов сохранены. */
const kx=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^0-9a-zа-я]+/g,"");
function ext(id,items){
  const c=CATS.find(x=>x.id===id);
  if(!c){ console.warn("ext: нет категории",id); return; }
  const seen=new Set(c.items.map(i=>kx(i[0])));
  for(const it of items){ const k=kx(it[0]); if(seen.has(k)) continue; seen.add(k); c.items.push(it); }
}
function setDesc(id,map){
  const c=CATS.find(x=>x.id===id);
  if(!c){ console.warn("setDesc: нет категории",id); return; }
  const m={}; for(const k in map) m[kx(k)]=map[k];
  c.items=c.items.map(([n,d])=>{ const nd=m[kx(n)]; return nd?[n,nd]:[n,d]; });
}

/* ── ФИНАЛЬНАЯ ЧИСТКА ──
   Снимает случайные повторы внутри категорий. В исходной версии их было 60:
   «Будуар» присутствовал и в общем справочнике комнат, и в разделе приватных,
   поэтому генератор «комната × стиль» выдавал его дважды по каждому стилю. */
(function(){
  const key=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
  let removed=0;
  for(const c of CATS){
    const seen=new Set(), out=[];
    for(const it of c.items){
      const k=key(it[0]);
      if(seen.has(k)){ removed++; continue; }
      seen.add(k); out.push(it);
    }
    c.items=out;
  }

  add(GA,"g_curt_win","🪟","Штора × тип окна","var(--g1)",

/* ── ПОРЯДОК РАЗДЕЛОВ ──
   В исходном файле категории шли вперемешку: разделы III–VI встречались по
   два раза, заголовок «III. УЧАСТОК И ОКРУЖЕНИЕ» рисовался только при первом
   появлении, и часть его категорий оказывалась под чужим заголовком.
   Сортировка по римскому номеру раздела собирает их обратно; внутри раздела
   порядок категорий сохраняется (Array.sort стабилен). */
(function(){
  const RV={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  const roman=s=>{
    const m=/^([IVXLCDM]+)\./.exec(s); if(!m) return 1e6;
    let n=0; const r=m[1];
    for(let i=0;i<r.length;i++){ const v=RV[r[i]], nx=RV[r[i+1]]||0; n+=nx>v?-v:v; }
    return n;
  };
  const ord=new Map();
  CATS.forEach(c=>{ if(!ord.has(c.g)) ord.set(c.g,[roman(c.g),ord.size]); });
  CATS.sort((a,b)=>{
    const x=ord.get(a.g), y=ord.get(b.g);
    return x[0]-y[0] || x[1]-y[1];
  });
})();

/* ── ФИНАЛЬНАЯ ЧИСТКА ПОВТОРОВ (после всех добавлений) ── */
(function(){
  const key=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
  let removed=0;
  for(const c of CATS){
    const seen=new Set(), out=[];
    for(const it of c.items){
      const k=key(it[0]);
      if(seen.has(k)){ removed++; continue; }
      seen.add(k); out.push(it);
    }
    c.items=out;
  }
  if(removed) console.info("Снято повторов (второй проход):",removed);
})();

let activeFilter="all",searchTerm="";
const norm=s=>s.toLowerCase().replace(/ё/g,"е");
function renderAll(){
 const total=CATS.reduce((s,c)=>s+c.items.length,0);
 const groups=[...new Set(CATS.map(c=>c.g))];
 let f='<button class="filter-btn '+(activeFilter==='all'?'active':'')+'" onclick="setFilter(\'all\')">Всё ('+total+')</button>';
 f+=CATS.map(c=>'<button class="filter-btn '+(activeFilter===c.id?'active':'')+'" onclick="setFilter(\''+c.id+'\')">'+c.emoji+' '+c.name+' ('+c.items.length+')</button>').join("");
 document.getElementById("filters").innerHTML=f;
 const view=activeFilter==="all"?CATS:CATS.filter(c=>c.id===activeFilter);
 const q=norm(searchTerm); let html="",vis=0,visCats=0,gseen=new Set();
 view.forEach(cat=>{
  const items=cat.items.filter(it=>!q||norm(it[0]).includes(q)||norm(it[1]||"").includes(q));
  if(!items.length)return;
  if(activeFilter==="all"&&!gseen.has(cat.g)){gseen.add(cat.g);html+='<div class="group-divider"><div class="gl"></div><div class="glabel">'+cat.g+'</div><div class="gl"></div></div>';}
  vis+=items.length;visCats++;
  const CAP=50;const limited=(activeFilter==="all"&&!q)&&items.length>CAP;const shown=limited?items.slice(0,CAP):items;let n=0;
  html+='<div class="cat"><div class="cat-head"><span class="cat-name" style="color:'+cat.color+';cursor:pointer" onclick="setFilter(\''+cat.id+'\')">'+cat.emoji+' '+cat.name+'</span><span class="cat-count">'+items.length+' поз.</span></div><div class="cat-desc">'+cat.desc+'</div><div class="rows">'+
   shown.map(it=>{n++;return '<div class="row"><div class="num">'+n+'</div><div><span class="nm">'+it[0]+'</span>'+(it[1]?'<span class="ds">— '+it[1]+'</span>':'')+'</div></div>';}).join("")+
   (limited?'<div class="row" style="cursor:pointer" onclick="setFilter(\''+cat.id+'\')"><div class="num">⋯</div><div><span class="nm" style="color:var(--g1)">… ещё '+(items.length-CAP)+' — открыть категорию ›</span></div></div>':'')+
   '</div></div>';
 });
 document.getElementById("content").innerHTML=html||'<div class="no-results">Ничего не найдено</div>';
 document.getElementById("stats").textContent="Показано: "+vis+" из "+total+" · категорий: "+visCats+" из "+CATS.length+" · разделов: "+groups.length;
 const plu=(n,a,b,c)=>{const d=n%10,e=n%100;return n+" "+(e>=11&&e<=14?c:d===1?a:d>=2&&d<=4?b:c);};
 document.getElementById("footer").textContent="Дом — мега-таксономия: "+plu(CATS.length,"категория","категории","категорий")+", "+plu(groups.length,"раздел","раздела","разделов")+", "+plu(total,"позиция","позиции","позиций")+".";
}
function setFilter(id){activeFilter=id;window.scrollTo(0,0);renderAll();}
function filterAll(){searchTerm=document.getElementById("search").value;renderAll();}
renderAll();
</script></body></html>
