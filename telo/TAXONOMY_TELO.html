фологическая сторона.","tags":["constitution"],"gender":"any"},{"id":3,"name":"Габитус","description":"Внешний облик человека в целом: телосложение вместе с осанкой, состоянием покровов и манерой держаться.","tags":["habitus"],"gender":"any"},{"id":4,"name":"Соматотип","description":"Тип телосложения, определяемый по выраженности его компонентов — жирового, мышечно-костного и линейного.","tags":["somatotype"],"gender":"any"},{"id":5,"name":"Тип телосложения","description":"Класс телосложений, выделенный в конституциональной схеме по совокупности признаков.","tags":["body type"],"gender":"any"},{"id":6,"name":"Морфотип","description":"Тип телосложения, выделенный по сочетанию измеримых признаков — размеров, пропорций, состава тела — без опоры на определённую конституциональную схему.","tags":["morphotype"],"gender":"any"},{"id":7,"name":"Пропорции тела","description":"Соотношения размеров частей тела между собой и с ростом, выражаемые индексами или долями.","tags":["body proportions"],"gender":"any"},{"id":8,"name":"Состав тела","description":"Соотношение компонентов массы тела — жировой и безжировой массы, мышц, костей и воды.","tags":["body composition"],"gender":"any"},{"id":9,"name":"Тотальные размеры тела","description":"Размеры, характеризующие тело в целом: длина тела, масса тела и обхват груди.","tags":["total body dimensions"],"gender":"any"},{"id":10,"name":"Силуэт","description":"Очертание тела спереди или сбоку, задаваемое соотношением ширины плеч, талии и бёдер и выступанием груди, живота и ягодиц.","tags":["silhouette"],"gender":"any"},{"id":11,"name":"Антропометрия","description":"Метод антропологии, измеряющий тело человека и его части по стандартным точкам и протоколам.","tags":["anthropometry"],"gender":"any"},{"id":12,"name":"Соматометрия","description":"Часть антропометрии, измеряющая живого человека: длины, ширины, обхваты, массу, толщину кожно-жировых складок.","tags":["somatometry"],"gender":"any"},{"id":13,"name":"Соматоскопия","description":"Описательный осмотр телосложения по словесным или балльным шкалам: развитие мускулатуры, жироотложение, форма грудной клетки, спины, ног и стоп.","tags":["somatoscopy"],"gender":"any"},{"id":14,"name":"Морфометрия","description":"Количественное описание формы и размеров органа или части тела измерениями, индексами и углами.","tags":["morphometry"],"gender":"any"},{"id":15,"name":"Норма в морфологии","description":"Диапазон значений признака, в котором находится большинство здоровых взрослых данной популяции; задаётся референтным интервалом.","tags":["normal range"],"gender":"any"},{"id":16,"name":"Вариант нормы","description":"Отклонение формы или размера от самого частого значения, не нарушающее функцию и не требующее лечения.","tags":["normal variant"],"gender":"any"},{"id":17,"name":"Аномалия развития","description":"Врождённое отклонение строения органа или части тела, возникшее при внутриутробном формировании.","tags":["congenital anomaly"],"gender":"any"},{"id":18,"name":"Деформация","description":"Изменение формы части тела против нормы, врождённое или приобретённое, с нарушением функции или без него.","tags":["deformity"],"gender":"any"},{"id":19,"name":"Асимметрия тела","description":"Различие правой и левой половин тела по размерам, положению или форме парных частей.","tags":["body asymmetry"],"gender":"any"},{"id":20,"name":"Изменённое телосложение","description":"Телосложение, размеры, форма или состав которого изменены фармакологическим, инъекционным или хирургическим вмешательством.","tags":["enhanced physique"],"gender":"any"}]},{"id":"measurement","title":"Измерение: виды размеров и инструменты","subtitle":"Длина, ширина, глубина, обхват, объём, угол; чем и по каким правилам измеряют","icon":"📏","color":"from-blue-500 to-indigo-600","category":"natural","items":[{"id":1,"name":"Антропометрический размер","description":"Величина, получаемая измерением тела или его части по стандартному протоколу — между определёнными точками или на определённом уровне.","tags":["anthropometric dimension"],"gender":"any"},{"id":2,"name":"Размеры по направлению измерения","description":"Деление размеров по тому, вдоль какой оси или по какой линии ведётся измерение. Слово «размер» без указания вида не определено: длина, ширина и обхват одной части тела — три разные величины.","tags":[],"gender":"any"},{"id":3,"name":"Продольный размер","description":"Антропометрический размер, измеряемый вдоль длинной оси тела или сегмента: длина тела, ноги, кисти. Синоним — длина.","tags":["length"],"gender":"any"},{"id":4,"name":"Высотный размер","description":"Антропометрический размер, измеряемый как высота антропометрической точки над опорной поверхностью.","tags":["height of landmark"],"gender":"any"},{"id":5,"name":"Поперечный размер","description":"Антропометрический размер, измеряемый во фронтальной плоскости между симметричными точками: ширина плеч, таза, кисти. Синонимы — ширина, поперечный диаметр.","tags":["breadth","width"],"gender":"any"},{"id":6,"name":"Сагиттальный размер","description":"Антропометрический размер, измеряемый в переднезаднем направлении: глубина грудной клетки, живота, выступание ягодиц. Синонимы — глубина, переднезадний диаметр.","tags":["depth"],"gender":"any"},{"id":7,"name":"Обхват","description":"Антропометрический размер, измеряемый по окружности тела или его части в плоскости, перпендикулярной её оси. Синоним — окружность.","tags":["circumference","girth"],"gender":"any"},{"id":8,"name":"Дуговой размер","description":"Антропометрический размер, измеряемый лентой по поверхности тела между двумя точками.","tags":["arc","surface distance"],"gender":"any"},{"id":9,"name":"Толщина кожно-жировой складки","description":"Толщина взятой пальцами складки кожи с подкожной клетчаткой, измеренная калипером.","tags":["skinfold thickness"],"gender":"any"},{"id":10,"name":"Объём части тела","description":"Величина пространства, занимаемого органом или частью тела; определяется водоизмещением, 3D-сканированием, по томограммам или расчётом по линейным размерам.","tags":["volume"],"gender":"any"},{"id":11,"name":"Угловой размер","description":"Угол между осями сегментов, линиями или плоскостями тела, измеренный гониометром, по снимку или фотографии.","tags":["angle"],"gender":"any"},{"id":12,"name":"Антропометрический индекс","description":"Отношение двух размеров, обычно умноженное на 100, освобождающее сравнение от абсолютной величины тела.","tags":["index","ratio"],"gender":"any"},{"id":13,"name":"Относительный размер","description":"Размер, выраженный в долях роста или другого размера.","tags":["relative dimension"],"gender":"any"},{"id":14,"name":"Диаметр по обхвату","description":"Расчётный поперечник цилиндрической части тела, равный обхвату, делённому на π (≈3,14); переводит окружность в ширину: обхват 12 см соответствует диаметру около 3,8 см.","tags":["diameter from circumference"],"gender":"any"},{"id":15,"name":"Эллиптичность сечения","description":"Отношение большего поперечника сечения части тела к меньшему; при значении больше 1 ширина и толщина различаются, а диаметр по обхвату лежит между ними.","tags":["ellipticity"],"gender":"any"},{"id":16,"name":"Состояние при измерении","description":"Условие, от которого зависит размер мягких тканей: покой или напряжение мышцы, вдох или выдох, температура, время суток, положение стоя или лёжа; в описании размера его указывают.","tags":["measurement state"],"gender":"any"},{"id":17,"name":"Антропометрический инструмент","description":"Прибор для получения антропометрического размера.","tags":["anthropometric instrument"],"gender":"any"},{"id":18,"name":"Антропометр","description":"Антропометрический инструмент в виде металлического стержня со шкалой и подвижной муфтой для высотных и продольных размеров, а с перекладинами — и поперечных. Классическая модель — антропометр Мартина.","tags":["anthropometer"],"gender":"any"},{"id":19,"name":"Ростомер","description":"Антропометрический инструмент в виде вертикальной шкалы с подвижной планкой для длины тела стоя или сидя.","tags":["stadiometer"],"gender":"any"},{"id":20,"name":"Сантиметровая лента","description":"Антропометрический инструмент в виде гибкой нерастяжимой ленты для обхватов и дуговых размеров.","tags":["tape measure"],"gender":"any"},{"id":21,"name":"Толстотный циркуль","description":"Антропометрический инструмент в виде циркуля с изогнутыми браншами для поперечных и сагиттальных размеров туловища и таза. В акушерстве — тазомер.","tags":["spreading caliper"],"gender":"any"},{"id":22,"name":"Скользящий циркуль","description":"Антропометрический инструмент в виде циркуля с прямыми браншами для малых поперечных размеров: ширины запястья, мыщелков, кисти.","tags":["sliding caliper"],"gender":"any"},{"id":23,"name":"Калипер","description":"Антропометрический инструмент в виде щипцов с постоянным давлением браншей (около 10 г/мм²) для толщины кожно-жировой складки.","tags":["skinfold caliper"],"gender":"any"},{"id":24,"name":"Гониометр","description":"Антропометрический инструмент в виде угломера с двумя браншами для амплитуд движений и углов между сегментами.","tags":["goniometer"],"gender":"any"},{"id":25,"name":"Динамометр","description":"Антропометрический инструмент для силы сжатия кисти или становой силы.","tags":["dynamometer"],"gender":"any"},{"id":26,"name":"Плантограф","description":"Антропометрический инструмент для отпечатка подошвы, по которому оценивают свод стопы.","tags":["plantograph"],"gender":"any"},{"id":27,"name":"3D-сканер тела","description":"Антропометрический инструмент в виде оптического устройства, восстанавливающего поверхность тела; размеры и объёмы получают по ней расчётом.","tags":["3D body scanner"],"gender":"any"},{"id":28,"name":"Протокол измерения","description":"Набор правил, по которым размер получают воспроизводимо: точки отсчёта, положение тела, инструмент, число повторов.","tags":["measurement protocol"],"gender":"any"},{"id":29,"name":"Протокол ISAK","description":"Протокол измерения, принятый Международным обществом развития кинантропометрии (ISAK): стандартные точки, складки, обхваты и порядок повторных измерений.","tags":["ISAK"],"gender":"any"},{"id":30,"name":"Стандарт ISO 7250","description":"Протокол измерения по международному стандарту ISO 7250: перечень основных размеров тела для эргономики и правила их получения.","tags":["ISO 7250"],"gender":"any"},{"id":31,"name":"Антропометрическая стойка","description":"Положение тела при измерении стоя: пятки вместе, носки врозь, масса распределена на обе ноги, руки опущены, голова во франкфуртской горизонтали.","tags":["anthropometric position"],"gender":"any"},{"id":32,"name":"Франкфуртская горизонталь","description":"Плоскость через нижний край левой глазницы и верхние края наружных слуховых проходов; при измерении роста её ставят горизонтально.","tags":["Frankfurt plane"],"gender":"any"}]},{"id":"landmarks","title":"Антропометрические точки","subtitle":"Костные и поверхностные ориентиры, от которых ведут измерения","icon":"📍","color":"from-stone-500 to-slate-700","category":"natural","items":[{"id":1,"name":"Антропометрическая точка","description":"Определённое место на поверхности тела, обычно над прощупываемым костным выступом, от которого или до которого ведут измерение.","tags":["landmark"],"gender":"any"},{"id":2,"name":"Верхушечная точка","description":"Антропометрическая точка на темени: наиболее высокая точка головы во франкфуртской горизонтали.","tags":["vertex"],"gender":"any"},{"id":3,"name":"Шейная точка","description":"Антропометрическая точка на вершине остистого отростка VII шейного позвонка.","tags":["cervicale"],"gender":"any"},{"id":4,"name":"Верхнегрудинная точка","description":"Антропометрическая точка на верхнем крае рукоятки грудины, в яремной вырезке.","tags":["suprasternale"],"gender":"any"},{"id":5,"name":"Среднегрудинная точка","description":"Антропометрическая точка на грудине на уровне сочленения IV рёбер.","tags":["mesosternale"],"gender":"any"},{"id":6,"name":"Сосковая точка","description":"Антропометрическая точка в центре соска.","tags":["thelion"],"gender":"any"},{"id":7,"name":"Пупочная точка","description":"Антропометрическая точка в центре пупка.","tags":["omphalion"],"gender":"any"},{"id":8,"name":"Лобковая точка","description":"Антропометрическая точка на верхнем крае лобкового симфиза по средней линии.","tags":["symphysion"],"gender":"any"},{"id":9,"name":"Плечевая точка","description":"Антропометрическая точка на наружном крае акромиального отростка лопатки.","tags":["acromiale"],"gender":"any"},{"id":10,"name":"Лучевая точка","description":"Антропометрическая точка на верхнем крае головки лучевой кости.","tags":["radiale"],"gender":"any"},{"id":11,"name":"Шиловидная точка","description":"Антропометрическая точка на вершине шиловидного отростка лучевой кости.","tags":["stylion"],"gender":"any"},{"id":12,"name":"Пальцевая точка","description":"Антропометрическая точка на кончике среднего пальца кисти.","tags":["dactylion"],"gender":"any"},{"id":13,"name":"Подвздошно-гребешковая точка","description":"Антропометрическая точка на наиболее выступающей кнаружи точке гребня подвздошной кости.","tags":["iliocristale"],"gender":"any"},{"id":14,"name":"Подвздошно-остистая точка","description":"Антропометрическая точка на передней верхней ости подвздошной кости.","tags":["iliospinale"],"gender":"any"},{"id":15,"name":"Вертельная точка","description":"Антропометрическая точка на верхушке большого вертела бедренной кости.","tags":["trochanterion"],"gender":"any"},{"id":16,"name":"Верхнеберцовая точка","description":"Антропометрическая точка на верхнем крае медиального мыщелка большеберцовой кости.","tags":["tibiale"],"gender":"any"},{"id":17,"name":"Нижнеберцовая точка","description":"Антропометрическая точка на нижнем крае медиальной лодыжки.","tags":["sphyrion"],"gender":"any"},{"id":18,"name":"Пяточная точка","description":"Антропометрическая точка на наиболее выступающей кзади точке пятки.","tags":["pternion"],"gender":"any"},{"id":19,"name" е волосы и веснушки.","tags":["Fitzpatrick I"],"gender":"any"},{"id":5,"name":"Фототип II","description":"Фототип кожи, при котором кожа обычно обгорает и загорает с трудом.","tags":["Fitzpatrick II"],"gender":"any"},{"id":6,"name":"Фототип III","description":"Фототип кожи, при котором кожа иногда обгорает и постепенно загорает до светло-коричневого.","tags":["Fitzpatrick III"],"gender":"any"},{"id":7,"name":"Фототип IV","description":"Фототип кожи, при котором кожа редко обгорает и легко загорает до умеренно коричневого.","tags":["Fitzpatrick IV"],"gender":"any"},{"id":8,"name":"Фототип V","description":"Фототип кожи, при котором кожа очень редко обгорает: коричневая кожа.","tags":["Fitzpatrick V"],"gender":"any"},{"id":9,"name":"Фототип VI","description":"Фототип кожи, при котором кожа никогда не обгорает: тёмно-коричневая и чёрная кожа.","tags":["Fitzpatrick VI"],"gender":"any"},{"id":10,"name":"Конституциональная пигментация","description":"Цвет кожи участков, не подвергавшихся солнцу, заданный генетически количеством и видом меланина.","tags":["constitutive pigmentation"],"gender":"any"},{"id":11,"name":"Факультативная пигментация","description":"Временное потемнение кожи под действием солнца (загар) или гормонов.","tags":["facultative pigmentation"],"gender":"any"},{"id":12,"name":"Альбинизм","description":"Наследственное отсутствие или резкое снижение меланина в коже, волосах и радужке.","tags":["albinism"],"gender":"any"},{"id":13,"name":"Подтон кожи","description":"Оттенок, просвечивающий через основной тон кожи: тёплый (жёлтый, персиковый), холодный (розовый, голубоватый) или нейтральный.","tags":["undertone"],"gender":"any"},{"id":14,"name":"Типы кожи по салоотделению","description":"Деление кожи по выработке кожного сала и состоянию её барьера.","tags":[],"gender":"any"},{"id":15,"name":"Сухая кожа","description":"Кожа со сниженным салоотделением, склонная к шелушению и стянутости.","tags":["dry skin"],"gender":"any"},{"id":16,"name":"Нормальная кожа","description":"Кожа с умеренным салоотделением, без шелушения и жирного блеска.","tags":["normal skin"],"gender":"any"},{"id":17,"name":"Жирная кожа","description":"Кожа с повышенным салоотделением, блеском и расширенными порами.","tags":["oily skin"],"gender":"any"},{"id":18,"name":"Комбинированная кожа","description":"Кожа, жирная в одних зонах и нормальная или сухая в других.","tags":["combination skin"],"gender":"any"},{"id":19,"name":"Тургор кожи","description":"Упругость кожи, оцениваемая по скорости расправления взятой складки.","tags":["skin turgor"],"gender":"any"},{"id":20,"name":"Эластичность кожи","description":"Способность кожи растягиваться и возвращаться к исходному состоянию; снижается с возрастом и после резких изменений объёма тела.","tags":["skin elasticity"],"gender":"any"},{"id":21,"name":"Толщина кожи","description":"Толщина эпидермиса и дермы; от 0,5 мм на веках до 4 мм и больше на спине и подошвах.","tags":["skin thickness"],"gender":"any"}]},{"id":"skin-marks","title":"Кожа: отметины, рубцы, растяжки","subtitle":"Пигментные образования, невусы по размеру, рубцы, стрии, мозоли","icon":"🩹","color":"from-stone-500 to-neutral-600","category":"natural","items":[{"id":1,"name":"Пигментное образование кожи","description":"Ограниченный участок кожи с изменённым количеством пигмента.","tags":["pigmented lesion"],"gender":"any"},{"id":2,"name":"Веснушки","description":"Пигментное образование кожи в виде мелких светло-коричневых пятен, темнеющих на солнце и бледнеющих зимой. Синоним — эфелиды.","tags":["freckles","ephelides"],"gender":"any"},{"id":3,"name":"Солнечное лентиго","description":"Пигментное образование кожи в виде плоского коричневого пятна на открытой солнцу коже, не бледнеющего зимой.","tags":["solar lentigo"],"gender":"any"},{"id":4,"name":"Меланоцитарный невус","description":"Пигментное образование кожи из скопления меланоцитов — родинка, плоская или возвышающаяся.","tags":["melanocytic nevus"],"gender":"any"},{"id":5,"name":"Пятно цвета кофе с молоком","description":"Пигментное образование кожи в виде светло-коричневого равномерно окрашенного пятна. Шесть и более пятен больше 15 мм у взрослого — признак нейрофиброматоза.","tags":["café-au-lait macule"],"gender":"any"},{"id":6,"name":"Дермальный меланоцитоз","description":"Пигментное образование кожи в виде сине-серого пятна от меланоцитов в дерме, обычно в крестцовой области.","tags":["dermal melanocytosis"],"gender":"any"},{"id":7,"name":"Витилиго","description":"Пигментное образование кожи в виде лишённых пигмента молочно-белых очагов с чёткими границами.","tags":["vitiligo"],"gender":"any"},{"id":8,"name":"Происхождение невуса","description":"Деление невусов по времени появления.","tags":[],"gender":"any"},{"id":9,"name":"Врождённый меланоцитарный невус","description":"Невус, существующий с рождения или с первых месяцев жизни.","tags":["congenital nevus"],"gender":"any"},{"id":10,"name":"Приобретённый меланоцитарный невус","description":"Невус, появившийся позже, обычно до 30–40 лет.","tags":["acquired nevus"],"gender":"any"},{"id":11,"name":"Классы врождённого невуса по размеру","description":"Деление по наибольшему размеру невуса во взрослом возрасте.","tags":[],"gender":"any"},{"id":12,"name":"Малый врождённый невус","description":"Врождённый невус с наибольшим размером менее 1,5 см.","tags":[],"gender":"any"},{"id":13,"name":"Средний врождённый невус","description":"Врождённый невус с наибольшим размером от 1,5 до 19,9 см.","tags":[],"gender":"any"},{"id":14,"name":"Крупный врождённый невус","description":"Врождённый невус с наибольшим размером от 20 до 40 см.","tags":[],"gender":"any"},{"id":15,"name":"Гигантский врождённый невус","description":"Врождённый невус с наибольшим размером более 40 см.","tags":[],"gender":"any"},{"id":16,"name":"Правило ABCDE","description":"Признаки родинки, требующей осмотра на меланому: асимметрия, неровный край, неоднородный цвет, диаметр больше 6 мм, изменение во времени.","tags":["ABCDE rule"],"gender":"any"},{"id":17,"name":"Себорейный кератоз","description":"Доброкачественное возвышающееся бородавчатое образование от светло- до тёмно-коричневого, учащающееся с возрастом.","tags":["seborrheic keratosis"],"gender":"any"},{"id":18,"name":"Акрохордон","description":"Мягкий кожный вырост на ножке в складках шеи, подмышек и паха.","tags":["skin tag"],"gender":"any"},{"id":19,"name":"Гранулы Фордайса","description":"Видимые эктопические сальные железы — желтоватые точки на красной кайме губ, коже полового члена, мошонки и половых губ; вариант нормы.","tags":["Fordyce spots"],"gender":"any"},{"id":20,"name":"Рубец","description":"Участок соединительной ткани, замещающий повреждённую кожу.","tags":["scar"],"gender":"any"},{"id":21,"name":"Виды рубцов","description":"Деление рубцов по отношению к уровню кожи и границам раны.","tags":[],"gender":"any"},{"id":22,"name":"Нормотрофический рубец","description":"Рубец, плоский, вровень с кожей.","tags":["normotrophic scar"],"gender":"any"},{"id":23,"name":"Атрофический рубец","description":"Рубец, западающий ниже уровня кожи.","tags":["atrophic scar"],"gender":"any"},{"id":24,"name":"Гипертрофический рубец","description":"Рубец, возвышающийся, не выходящий за границы раны и со временем уплощающийся.","tags":["hypertrophic scar"],"gender":"any"},{"id":25,"name":"Келоидный рубец","description":"Рубец, возвышающийся, выходящий за границы исходного повреждения и не уменьшающийся сам.","tags":["keloid"],"gender":"any"},{"id":26,"name":"Контрактурный рубец","description":"Рубец, стягивающий кожу и ограничивающий движения.","tags":["contracture scar"],"gender":"any"},{"id":27,"name":"Ванкуверская шкала рубцов","description":"Оценка рубца по сосудистости, пигментации, податливости и высоте; сумма от 0 до 13 баллов.","tags":["Vancouver Scar Scale"],"gender":"any"},{"id":28,"name":"Ожоговый рубец","description":"Рубец после термического или химического ожога, часто неровный, гипертрофический и стягивающий.","tags":["burn scar"],"gender":"any"},{"id":29,"name":"Рубцы постакне","description":"Атрофические — точечные глубокие, прямоугольные, волнообразные — или гипертрофические рубцы после воспалительного акне.","tags":["acne scars"],"gender":"any"},{"id":30,"name":"Стрии","description":"Линейные атрофические полосы кожи от разрыва волокон дермы при быстром растяжении или избытке глюкокортикоидов.","tags":["striae"],"gender":"any"},{"id":31,"name":"Стрии по стадии","description":"Деление стрий по давности.","tags":[],"gender":"any"},{"id":32,"name":"Красные стрии","description":"Стрии на ранней стадии: красные или фиолетовые, слегка приподнятые.","tags":["striae rubrae"],"gender":"any"},{"id":33,"name":"Белые стрии","description":"Стрии на поздней стадии: белые или серебристые, западающие, с морщинистой поверхностью.","tags":["striae albae"],"gender":"any"},{"id":34,"name":"Стрии по происхождению","description":"Деление стрий по причине растяжения кожи.","tags":[],"gender":"any"},{"id":35,"name":"Стрии растяжения","description":"Стрии при быстром наборе массы или росте мышц: на бёдрах, ягодицах, груди, плечах.","tags":["striae distensae"],"gender":"any"},{"id":36,"name":"Стрии беременности","description":"Стрии при беременности: на животе, бёдрах и груди.","tags":["striae gravidarum"],"gender":"any"},{"id":37,"name":"Гормональные стрии","description":"Стрии при избытке глюкокортикоидов: широкие, больше 1 см, багровые, на животе и бёдрах.","tags":["Cushing striae"],"gender":"any"},{"id":38,"name":"Мозоль","description":"Ограниченное утолщение рогового слоя от повторяющегося давления или трения — на ладонях, подошвах, пальцах.","tags":["callus"],"gender":"any"},{"id":39,"name":"Фолликулярный кератоз","description":"Мелкие роговые бугорки у устьев волосяных фолликулов на плечах и бёдрах.","tags":["keratosis pilaris"],"gender":"any"},{"id":40,"name":"Акне тела","description":"Воспаление сальных фолликулов кожи спины, плеч и груди.","tags":["body acne"],"gender":"any"}]},{"id":"body-hair","title":"Волосы на теле и выпадение волос","subtitle":"Пушковые и терминальные волосы, андрогензависимые зоны, гирсутизм, гипертрихоз, цикл роста, алопеция","icon":"🌾","color":"from-lime-500 to-green-600","category":"natural","items":[{"id":1,"name":"Волос","description":"Нитевидный роговой придаток кожи, растущий из волосяного фолликула.","tags":["hair"],"gender":"any"},{"id":2,"name":"Типы волос по строению","description":"Деление волос по толщине, длине и пигментации.","tags":[],"gender":"any"},{"id":3,"name":"Пушковый волос","description":"Волос, тонкий, короткий, слабо окрашенный, без сердцевины.","tags":["vellus hair"],"gender":"any"},{"id":4,"name":"Промежуточный волос","description":"Волос по толщине и окраске между пушковым и терминальным.","tags":["intermediate hair"],"gender":"any"},{"id":5,"name":"Терминальный волос","description":"Волос, длинный, толстый, окрашенный, с сердцевиной.","tags":["terminal hair"],"gender":"any"},{"id":6,"name":"Андрогензависимое оволосение","description":"Терминальное оволосение зон, где рост волос стимулируют андрогены: лица, груди, живота, спины, подмышек и лобка.","tags":["androgen-dependent hair"],"gender":"any"},{"id":7,"name":"Оволосение груди","description":"Терминальные волосы на передней поверхности груди; у мужчин — от отсутствия до сплошного покрова, чаще по грудине и вокруг сосков.","tags":["chest hair"],"gender":"any"},{"id":8,"name":"Оволосение живота","description":"Терминальные волосы на животе; у мужчин часто полоса от пупка книзу.","tags":["abdominal hair"],"gender":"any"},{"id":9,"name":"Оволосение спины","description":"Терминальные волосы спины и надплечий, у мужчин нарастающие с годами.","tags":["back hair"],"gender":"any"},{"id":10,"name":"Подмышечное оволосение","description":"Терминальные волосы подмышечных впадин, андрогензависимые у обоих полов.","tags":["axillary hair"],"gender":"any"},{"id":11,"name":"Оволосение конечностей","description":"Терминальные волосы рук и ног, гуще на голенях и предплечьях.","tags":["limb hair"],"gender":"any"},{"id":12,"name":"Гирсутизм","description":"Избыточный рост терминальных волос у женщины в андрогензависимых зонах по мужскому типу.","tags":["hirsutism"],"gender":"female"},{"id":13,"name":"Шкала Ферримана — Голлвея","description":"Оценка оволосения девяти зон — верхней губы, подбородка, груди, верха и низа спины, верха и низа живота, плеча, бедра — по 0–4 балла; сумма 8 и больше в модифицированной шкале считается гирсутизмом, для ряда азиатских популяций порог ниже.","tags":["Ferriman-Gallwey score"],"gender":"female"},{"id":14,"name":"Гипертрихоз","description":"Избыточный рост волос, не зависящий от андрогенов и не ограниченный андрогензависимыми зонами.","tags":["hypertrichosis"],"gender":"any"},{"id":15,"name":"Генерализованный гипертрихоз","description":"Гипертрихоз по всему телу.","tags":["generalized hypertrichosis"],"gender":"any"},{"id":16,"name":"Локальный гипертрихоз","description":"Гипертрихоз на ограниченном участке — над невусом, в месте постоянного трения.","tags":["localized hypertrichosis"],"gender":"any"},{"id":17,"name":"Цикл роста волоса","description":"Смена фаз роста (анаген, у волос головы 2–6 лет), инволюции (катаген, 2–3 недели) и покоя (телоген, около 3 месяцев).","tags":["hair cycle"],"gender":"any"},{"id":18,"name":"Норма выпадения волос","description":"Потеря до ~100 волос головы в сутки при обычной смене телогеновых волос.","tags":["normal shedding"],"gender":"any"},{"id":19,"name":"Алопеция","description":"Выпадение волос с поредением или облысением участка.","tags":["alopecia"],"gender":"any"},{"id":20,"name":"Андрогенная алопеция","description":"Алопеция, обусловленная чувствительностью фолликулов к андрогенам: у мужчин — отступление лобной линии и облысение темени, у женщин — диффузное поредение центральной части.","tags":["androgenetic alopecia"],"gender":"any"},{"id":21,"name":"Гнёздная алопеция","description":"Алопеция, аутоиммунная, с круглыми гладкими очагами облысения.","tags":["alopecia areata"],"gender":"any"},{"id":22,"name":"Телогеновое выпадение","description":"Алопеция с диффузным выпадением через 2–3 месяца после стресса, болезни, родов или резкого похудания; обычно обратимая.","tags":["telogen effluvium"],"gender":"any"},{"id":23,"name":"Рубцовая алопеция","description":"Алопеция с разрушением фолликулов и рубцеванием кожи.","tags":["cicatricial alopecia"],"gender":"any"},{"id":24,"name":"Шкала Норвуда — Гамильтона","description":"Оценка мужской андрогенной алопеции по 7 стадиям — от сохранной линии роста (I) до облысения всей верхней части головы с сохранением подковы волос по бокам и сзади (VII).","tags":["Norwood-Hamilton scale"],"gender":"male"},{"id":25,"name":"Шкала Людвиг","description":"Оценка женской андрогенной алопеции по 3 стадиям поредения центральной части головы при сохранённой лобной линии.","tags":["Ludwig scale"],"gender":"female"},{"id":26,"name":"Седина","description":"Утрата волосами пигмента с возрастом; время начала и скорость наследственны.","tags":["canities"],"gender":"any"},{"id":27,"name":"Удаление волос с тела","description":"Устранение волос с поверхности тела.","tags":["hair removal"],"gender":"any"},{"id":28,"name":"Депиляция","description":"Удаление волос с тела без воздействия на луковицу: бритьём или химическим кремом.","tags":["depilation"],"gender":"any"},{"id":29,"name":"Эпиляция","description":"Удаление волос с тела с извлечением луковицы или разрушением фолликула: воском, сахарной пастой, лазером, светом, током.","tags":["epilation"],"gender":"any"}]},{"id":"nails","title":"Ногти","subtitle":"Строение ногтя, изменения формы, поверхности и цвета пластины","icon":"💅","color":"from-rose-400 to-pink-600","category":"natural","items":[{"id":1,"name":"Ноготь","description":"Роговая пластинка на тыльной поверхности концевой фаланги пальца.","tags":["nail"],"gender":"any"},{"id":2,"name":"Ногтевая пластина","description":"Видимая роговая часть ногтя.","tags":["nail plate"],"gender":"any"},{"id":3,"name":"Ногтевое ложе","descript adult age period"],"gender":"any"},{"id":2,"name":"Периоды взрослой жизни","description":"Деление, принятое в отечественной возрастной морфологии (1965).","tags":[],"gender":"any"},{"id":3,"name":"Первый период зрелого возраста","description":"Возрастной период взрослого от 22 до 35 лет у мужчин и от 21 до 35 лет у женщин.","tags":[],"gender":"any"},{"id":4,"name":"Второй период зрелого возраста","description":"Возрастной период взрослого от 36 до 60 лет у мужчин и от 36 до 55 лет у женщин.","tags":[],"gender":"any"},{"id":5,"name":"Пожилой возраст","description":"Возрастной период взрослого от 61 до 74 лет у мужчин и от 56 до 74 лет у женщин.","tags":[],"gender":"any"},{"id":6,"name":"Старческий возраст","description":"Возрастной период взрослого от 75 до 90 лет.","tags":[],"gender":"any"},{"id":7,"name":"Долгожительство","description":"Возрастной период взрослого после 90 лет.","tags":[],"gender":"any"},{"id":8,"name":"Возрастная убыль роста","description":"Уменьшение роста во второй половине жизни из-за истончения межпозвонковых дисков, снижения высоты позвонков и усиления кифоза; ускоряется после 60 лет.","tags":["age-related height loss"],"gender":"any"},{"id":9,"name":"Возрастная потеря мышечной массы","description":"Постепенное снижение мышечной массы — порядка 3–8 % за десятилетие после 30 лет с ускорением после 60.","tags":["age-related muscle loss"],"gender":"any"},{"id":10,"name":"Возрастное перераспределение жира","description":"Смещение жира с конечностей на туловище и в брюшную полость при неизменной или растущей массе тела.","tags":["fat redistribution"],"gender":"any"},{"id":11,"name":"Возрастной кифоз","description":"Усиление грудного кифоза с годами при снижении высоты передних отделов позвонков и слабости разгибателей спины.","tags":["age-related kyphosis"],"gender":"any"},{"id":12,"name":"Возрастные изменения кожи","description":"Истончение дермы, снижение эластичности и тургора, морщины, пигментные пятна, себорейный кератоз.","tags":["skin ageing"],"gender":"any"},{"id":13,"name":"Менопаузальные изменения телосложения","description":"Сдвиг к андроидному распределению жира, ускорение потери костной массы и снижение мышечной массы после менопаузы.","tags":["menopausal changes"],"gender":"female"},{"id":14,"name":"Возрастное снижение тестостерона","description":"Постепенное снижение уровня тестостерона у мужчин после 30–40 лет — около 1 % в год — с уменьшением мышечной и ростом жировой массы.","tags":["age-related testosterone decline"],"gender":"male"},{"id":15,"name":"Старческая астения","description":"Синдром снижения физиологического резерва: непреднамеренная потеря массы, слабость, медленная ходьба, низкая активность.","tags":["frailty"],"gender":"any"}]},{"id":"pregnancy","title":"Беременность и послеродовой период","subtitle":"Прибавка массы по ИМТ, осанка, грудь, линия живота, восстановление после родов","icon":"🤰","color":"from-rose-400 to-pink-600","category":"natural","items":[{"id":1,"name":"Прибавка массы при беременности","description":"Рекомендуемая прибавка по исходному ИМТ (IOM, 2009): 12,5–18 кг при дефиците массы, 11,5–16 кг при нормальной массе, 7–11,5 кг при избыточной, 5–9 кг при ожирении.","tags":["gestational weight gain"],"gender":"female"},{"id":2,"name":"Изменения осанки при беременности","description":"Смещение центра тяжести вперёд с усилением поясничного лордоза и наклона таза.","tags":["pregnancy posture"],"gender":"female"},{"id":3,"name":"Изменения молочных желёз при беременности","description":"Увеличение объёма, потемнение ареол, увеличение бугорков Монтгомери, проступание вен.","tags":["pregnancy breast changes"],"gender":"female"},{"id":4,"name":"Тёмная линия живота","description":"Пигментированная полоса по белой линии от лобка к пупку и выше при беременности; бледнеет после родов.","tags":["linea nigra"],"gender":"female"},{"id":5,"name":"Послеродовой период","description":"Около 6–8 недель после родов, за которые органы возвращаются к состоянию до беременности.","tags":["postpartum period"],"gender":"female"},{"id":6,"name":"Послеродовое восстановление живота","description":"Уменьшение объёма живота с обратным развитием матки; могут сохраняться диастаз, растянутая кожа и стрии.","tags":["postpartum abdomen"],"gender":"female"},{"id":7,"name":"Изменения груди после лактации","description":"Уменьшение объёма за счёт обратного развития железистой ткани с усилением птоза и уплощением верхнего полюса.","tags":["post-lactation changes"],"gender":"female"},{"id":8,"name":"Рубец после кесарева сечения","description":"Обычно поперечный надлобковый рубец, иногда с нависающей над ним кожей.","tags":["caesarean scar"],"gender":"female"}]},{"id":"endocrine-signs","title":"Эндокринные признаки в телосложении","subtitle":"Кушингоид, акромегалия, евнухоидные пропорции, гипогонадизм, гиперандрогения, щитовидная железа","icon":"🔬","color":"from-emerald-500 to-teal-600","category":"natural","items":[{"id":1,"name":"Кушингоидное телосложение","description":"Телосложение при избытке глюкокортикоидов: центральное ожирение при тонких конечностях, округлое лицо, дорсоцервикальное жировое депо, широкие багровые стрии, мышечная слабость.","tags":["cushingoid habitus"],"gender":"any"},{"id":2,"name":"Акромегалическое телосложение","description":"Изменения при избытке гормона роста у взрослого: увеличение кистей, стоп, надбровных дуг, нижней челюсти и носа, утолщение кожи.","tags":["acromegaly"],"gender":"any"},{"id":3,"name":"Евнухоидные пропорции","description":"Пропорции при недостатке половых гормонов в период роста: длинные конечности, размах рук больше роста на 5 см и более, нижний сегмент тела длиннее верхнего.","tags":["eunuchoid proportions"],"gender":"any"},{"id":4,"name":"Гипогонадизм у мужчин в телосложении","description":"Признаки недостатка андрогенов у взрослого мужчины: снижение мышечной массы и оволосения, прибавка жира, гинекомастия, уменьшение объёма яичек.","tags":["male hypogonadism"],"gender":"male"},{"id":5,"name":"Гиперандрогения у женщин в телосложении","description":"Признаки избытка андрогенов: гирсутизм, акне, андрогенная алопеция, андроидное распределение жира, при выраженной — увеличение клитора и огрубение голоса.","tags":["hyperandrogenism"],"gender":"female"},{"id":6,"name":"Синдром поликистозных яичников в телосложении","description":"Частые соматические признаки СПКЯ: абдоминальное ожирение, гирсутизм, акне; у части женщин масса тела нормальная.","tags":["PCOS"],"gender":"female"},{"id":7,"name":"Гипотиреоз в телосложении","description":"Прибавка массы, отёчность лица и конечностей, сухая бледная кожа, ломкие волосы.","tags":["hypothyroidism"],"gender":"any"},{"id":8,"name":"Гипертиреоз в телосложении","description":"Снижение массы при сохранённом аппетите, потливость, тремор, мышечная слабость.","tags":["hyperthyroidism"],"gender":"any"}]},{"id":"genetic-conditions","title":"Генетические состояния с характерной соматикой","subtitle":"Марфан, Элерс — Данлос, ахондроплазия, Тёрнер, Клайнфельтер, Нунан, Даун, Прадер — Вилли, нарушения формирования пола","icon":"🧩","color":"from-violet-500 to-purple-700","category":"natural","items":[{"id":1,"name":"Синдром Марфана","description":"Наследственное нарушение соединительной ткани: высокий рост, отношение размаха рук к росту больше 1,05, арахнодактилия, деформации грудной клетки, гипермобильность, подвывих хрусталика, расширение аорты.","tags":["Marfan syndrome"],"gender":"any"},{"id":2,"name":"Синдром Элерса — Данлоса (гипермобильный тип)","description":"Наследственное состояние с генерализованной гипермобильностью суставов, мягкой растяжимой кожей и частыми подвывихами.","tags":["hypermobile EDS"],"gender":"any"},{"id":3,"name":"Ахондроплазия","description":"Наследственная непропорциональная низкорослость: укорочение проксимальных сегментов конечностей при туловище обычной длины, большая голова; рост взрослых около 125–131 см.","tags":["achondroplasia"],"gender":"any"},{"id":4,"name":"Синдром Тёрнера","description":"Отсутствие или изменение енение)","description":"Препарат для изменения телосложения, типа кленбутерола, применяемый для снижения жира; опасен для сердца.","tags":["beta-2 agonist"],"gender":"any"},{"id":7,"name":"Тиреоидный гормон (немедицинское применение)","description":"Препарат для изменения телосложения, ускоряющий обмен для снижения жира; ведёт к потере мышц и нарушениям ритма сердца.","tags":["thyroid hormone"],"gender":"any"},{"id":8,"name":"Диуретик (немедицинское применение)","description":"Препарат для изменения телосложения, выводящий воду перед выступлением для подчёркивания рельефа; опасен нарушением электролитов.","tags":["diuretic"],"gender":"any"},{"id":9,"name":"Вспомогательное средство курса","description":"Препарат для изменения телосложения, применяемый против побочных эффектов стероидов: ингибиторы ароматазы, антиэстрогены, хорионический гонадотропин.","tags":["ancillary"],"gender":"any"},{"id":10,"name":"Группы стероидов по строению","description":"Деление стероидов по исходной молекуле и химической модификации.","tags":[],"gender":"any"},{"id":11,"name":"Тестостерон и его эфиры","description":"Анаболический стероид на основе самого тестостерона, в инъекционных формах разной длительности действия.","tags":["testosterone esters"],"gender":"any"},{"id":12,"name":"Производные 19-нортестостерона","description":"Анаболический стероид на основе 19-нортестостерона, например нандролон: с меньшей андрогенностью и выраженным подавлением собственной выработки гормонов.","tags":["19-nortestosterone"],"gender":"any"},{"id":13,"name":"Производные дигидротестостерона","description":"Анаболический стероид на основе дигидротестостерона: не превращающиеся в эстрогены, с меньшей задержкой воды.","tags":["DHT derivatives"],"gender":"any"},{"id":14,"name":"17α-алкилированные стероиды","description":"Анаболический стероид с метильной группой в положении 17α, пригодные для приёма внутрь и токсичные для печени.","tags":["17α-alkylated"],"gender":"any"},{"id":15,"name":"Риски ПЭД","descripti
