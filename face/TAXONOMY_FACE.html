 (рецессивный)",tags:["sloped_forehead","receding_forehead"]},{id:8,name:"Надбровные дуги (глабелла)",desc:"Выступающий рельеф над бровями",tags:["brow_ridge","supraorbital_ridge","glabella"]},{id:9,name:"Межбровная складка (вертикаль)",desc:"«Глабеллярные» линии — №11 между бровями",tags:["glabellar_lines","frown_lines","11_lines"]},{id:10,name:"Вдовий пик",desc:"V-образный выступ линии волос по центру",tags:["widows_peak","v_hairline"]},{id:11,name:"Прямая линия волос",desc:"Горизонтальная линия роста волос",tags:["straight_hairline"]},{id:12,name:"M-образная линия волос",desc:"Рецессия по углам, сохранение центра",tags:["m_shaped_hairline","receding_hairline"]}]},{id:"eyebrows",title:"Брови (Supercilium)",subtitle:"Форма, посадка, толщина, выражение",color:"indigo",entries:[{id:1,name:"Прямые брови",desc:"Горизонтальный ход без изгиба",tags:["straight_eyebrows","flat_brows"]},{id:2,name:"Высокая арка бровей",desc:"Резкий пик в центре или у внешнего угла",tags:["high_arch_eyebrows","peaked_brows"]},{id:3,name:"Угловатые брови",desc:"Резкий излом под углом",tags:["angular_eyebrows","angled_brows"]},{id:4,name:"Нисходящие брови (скорбные)",desc:"Внешние уголки опущены вниз",tags:["downturned_eyebrows","sad_brows"]},{id:5,name:"Монобровь (сросшиеся)",desc:"Брови соединяются над переносицей",tags:["monobrow","unibrow","synophrys"]},{id:6,name:"Близко посаженные брови",desc:"Малое расстояние между бровями",tags:["close_set_eyebrows"]},{id:7,name:"Густые брови",desc:"Высокая плотность волос, выраженные",tags:["thick_eyebrows","bushy_eyebrows","bold_brows"]},{id:8,name:"Клочковатые брови",desc:"Неоднородная, хаотичная форма",tags:["bushy_eyebrows","unkempt_brows"]},{id:9,name:"Татуированные брови",desc:"Перманентный макияж, чёткий контур",tags:["tattooed_eyebrows","microblading"]},{id:10,name:"Частичное отсутствие (хвост)",desc:"Брови заканчиваются раньше внешнего угла",tags:["sparse_eyebrow_tail"]},{id:11,name:"Разрез в брови",desc:"Выбритая полоска — субкультурный маркер",tags:["eyebrow_slit","eyebrow_cut"]},{id:12,name:"Приподнятые внутренние уголки",desc:"«Волнующиеся» брови — признак замешательства",tags:["raised_inner_brow"]},{id:13,name:"Нахмуренные брови",desc:"Сдвинуты к центру, вниз — гнев/сосредоточенность",tags:["furrowed_brows","knitted_brows"]},{id:14,name:"Высоко поднятые брови",desc:"Удивление, шок, экспрессия",tags:["raised_eyebrows"]}]},{id:"eyes",title:"Глаза (Oculi) — Форма и посадка",subtitle:"Форма глазной щели, уголки, посадка",color:"cyan",entries:[{id:1,name:"Монолидные глаза",desc:"Одинарное веко, без складки (эпикантус)",tags:["monolid","single_eyelid"]},{id:2,name:"Выступающие глаза (экзофтальм)",desc:"Глазное яблоко выдвинуто вперёд",tags:["prominent_eyes","protruding_eyes","exophthalmos"]},{id:3,name:"Восходящий разрез (кошачий)",desc:"Наружные уголки подняты выше внутренних",tags:["upturned_eyes","cat_eyes","fox_eyes"]},{id:4,name:"Нисходящий разрез (грустный)",desc:"Наружные уголки опущены ниже внутренних",tags:["downturned_eyes","droopy_eyes"]},{id:5,name:"Эпикантус (медиальный)",desc:"Складка кожи у внутреннего угла глаза",tags:["epicanthal_fold","epicanthus"]},{id:6,name:"Обратный эпикантус",desc:"Складка у наружного угла",tags:["epicanthus_inversus"]},{id:7,name:"Разный разрез глаз",desc:"Левый и правый глаз отличаются формой",tags:["asymmetric_eyes"]},{id:8,name:"Гетерохромия",desc:"Разный цвет радужки у двух глаз",tags:["heterochromia"]},{id:9,name:"Глаза с поволокой",desc:"Тяжёлые, полуприкрытые — чувственный образ",tags:["bedroom_eyes","half-lidded_eyes","sultry_eyes"]},{id:10,name:"Невинный взгляд снизу вверх (Bambi)",desc:"Взгляд вверх с наклоном головы вниз",tags:["doe_eyes","innocent_eyes","puppy_eyes"]}]},{id:"eyes_detail",title:"Глаза — Цвет, Детали, Элементы",subtitle:"Радужка, зрачок, склера, ресницы",color:"teal",entries:[{id:1,name:"Тёмно-карие глаза",desc:"Меланина столько, что радужка почти сливается со зрачком",tags:["dark_brown_eyes","nearly_black_eyes"]},{id:2,name:"Светло-карие/ореховые глаза",desc:"Hazel — смесь карего и зелёного",tags:["hazel_eyes","light_brown_eyes"]},{id:3,name:"Фиолетовые глаза",desc:"Крайне редко, генетическая аномалия / линзы",tags:["purple_eyes","violet_eyes"]},{id:4,name:"Красные/рубиновые глаза",desc:"Альбинизм — отражение сосудов",tags:["red_eyes","pink_eyes","ruby_eyes"]},{id:5,name:"Лимбальное кольцо",desc:"Тёмное кольцо по краю радужки — признак здоровья",tags:["limbal_ring"]},{id:6,name:"Зрачок расширен",desc:"Мидриаз — темнота, возбуждение, наркотики",tags:["dilated_pupils","mydriasis"]},{id:7,name:"Зрачок сужен",desc:"Миоз — яркий свет, некоторые вещества",tags:["constricted_pupils","miosis"]},{id:8,name:"Вертикальный зрачок",desc:"Кошачий зрачок (образ)",tags:["slit_pupil","vertical_pupil","cat_slit_pupils"]},{id:9,name:"Блеск в глазах (catchlight)",desc:"Отблеск света в радужке — живость образа",tags:["catchlight","eye_sparkle","shiny_eyes"]},{id:10,name:"Слёзные мешочки (aegyo sal)",desc:"Жировые подушечки под нижним веком — корейская эстетика",tags:["aegyo_sal","eye_smile","under_eye_fat"]},{id:11,name:"Густые ресницы",desc:"Длинные, тёмные, выразительные",tags:["long_eyelashes","thick_eyelashes","dark_eyelashes"]},{id:12,name:"Тонкие/редкие ресницы",desc:"Малозаметные, светлые",tags:["sparse_eyelashes","light_eyelashes"]},{id:13,name:"Завитые ресницы",desc:"Изогнутые вверх, открывают взгляд",tags:["curled_eyelashes"]},{id:14,name:"Прямые ресницы (азиатский тип)",desc:"Горизонтально растущие ресницы",tags:["straight_eyelashes"]},{id:15,name:"Очень длинные нижние ресницы",desc:"Выраженные ресницы нижнего века",tags:["lower_lashes"]},{id:16,name:"Склера видимая снизу (sanpaku)",desc:"Белок видна под радужкой — усталость/мистика",tags:["sanpaku","visible_sclera_below"]},{id:17,name:"Склера видимая сверху",desc:"Крайнее закатывание — страх/шок/экстаз",tags:["visible_sclera_above"]},{id:18,name:"Кровяные прожилки в склере",desc:"Усталость, стресс, агрессия",tags:["bloodshot_eyes","red_sclera"]}]},{id:"nos
